<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribly</title>
    <link rel="icon" href="maskable_icon (2).png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a2e1a, #1a5c35);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
        }
        .splash {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: #2ecc71;
            border-radius: 28px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounce 0.6s ease;
        }
        .logo img { width: 60px; height: 60px; }
        h1 { color: white; font-size: 40px; margin-bottom: 8px; }
        p { color: rgba(255,255,255,0.8); font-size: 12px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounce {
            0% { transform: scale(0.8); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="logo">
            <img src="maskable_icon (2).png" alt="Tribly">
        </div>
        <h1>Tribly</h1>
        <p>GROWING TOGETHER</p>
    </div>
    <script>setTimeout(() => location.href = "https://triblyapp.infinityfreeapp.com/", 2000);</script>
</body>
</html>
