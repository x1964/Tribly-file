<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تحويلك إلى Tribly...</title>
    
    <!-- تحويل تلقائي بعد ثانية واحدة -->
    <meta http-equiv="refresh" content="1; url=https://triblyapp.infinityfreeapp.com/">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        .loader-container {
            text-align: center;
            position: relative;
        }
        
        /* الدائرة المتحركة */
        .spinner {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            position: relative;
        }
        
        .spinner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #00d26a;
            border-right-color: #00b894;
            border-bottom-color: #00cec9;
            border-left-color: #81ecec;
            animation: spin 1.5s linear infinite;
        }
        
        .spinner::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #00d26a;
            border-bottom-color: #00b894;
            animation: spin 1s linear infinite reverse;
        }
        
        /* الشعار في المنتصف */
        .logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: #00d26a;
            text-shadow: 0 0 20px rgba(0, 210, 106, 0.5);
            z-index: 10;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* النص */
        .loading-text {
            color: #fff;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }
        
        .sub-text {
            color: #81ecec;
            font-size: 14px;
            opacity: 0;
            animation: fadeInUp 0.6s ease 0.3s forwards;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* تأثير الخلفية */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 210, 106, 0.3);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        
        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 30%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 50%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 70%; animation-delay: 6s; }
        .particle:nth-child(5) { left: 90%; animation-delay: 8s; }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- جسيمات خلفية -->
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <div class="loader-container">
        <div class="spinner">
            <div class="logo">T</div>
        </div>
        <div class="loading-text">جاري تحويلك إلى Tribly...</div>
        <div class="sub-text">يرجى الانتظار لحظات</div>
    </div>
    
    <script>
        // تحويل فوري عند تحميل الصفحة
        window.onload = function() {
            setTimeout(function() {
                window.location.replace("https://triblyapp.infinityfreeapp.com/");
            }, 1000);
        };
    </script>
</body>
</html>
